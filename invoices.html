<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="icon" href="logo.jpg"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices — FineInvoice</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/theme.css"><style>.search-bar{display:flex;gap:12px;margin-bottom:20px}.search-wrap{position:relative;flex:1}.search-wrap .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}.search-wrap input{padding-left:40px}.status-badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}.status-saved{background:var(--violet-l);color:var(--violet)}.status-paid{background:var(--mint-l);color:var(--mint)}.inv-amount{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;color:var(--violet)}.empty-state{text-align:center;padding:80px 20px;color:var(--muted)}.empty-state .icon{font-size:56px;margin-bottom:16px}.empty-state h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}.empty-state p{font-size:14px;margin-bottom:24px}.action-btns{display:flex;gap:6px}</style></head><body><div class="app-layout"><button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button><div class="sidebar-overlay" onclick="toggleSidebar()"></div><aside class="sidebar"><div class="sb-logo"><img src="logo.jpg" alt="FineInvoice"><span>FineInvoice</span></div><nav class="sb-nav"><a href="dashboard.html">🏠 Dashboard</a><a href="app.html">✏️ New Invoice</a><a href="invoices.html" class="active">📋 Invoices</a><a href="templates.html">📄 Templates</a><a href="receipt.html">🧾 Receipts</a><a href="reports.html">📊 Reports</a><a href="customers.html">👥 Customers</a><a href="payment.html">💳 Billing</a></nav><div class="sb-footer"><a href="#" onclick="logout();return false">🚪 Sign Out</a></div></aside><div class="main-content"><div class="topbar"><span class="topbar-title">📋 Invoices</span><div class="topbar-right" id="userChip"></div></div><div class="page-body"><div class="section-head mb-6"><div><div class="section-title" style="font-size:18px">All Invoices</div><div class="text-muted text-sm mt-1" id="invoiceCountLabel">0 invoices</div></div><a href="app.html" class="btn btn-primary">+ New Invoice</a></div><div class="search-bar"><div class="search-wrap"><span class="search-icon">🔍</span><input class="form-input" id="search" placeholder="Search by company or customer…" oninput="renderInvoices()"></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Invoice #</th><th>Company</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody id="invoiceTable"></tbody></table></div><div id="emptyState" class="empty-state" style="display:none"><div class="icon">📭</div><h3>No invoices yet</h3><p>Create your first invoice and it will appear here.</p><a href="app.html" class="btn btn-primary">Create Invoice</a></div></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/utils.js"></script><script>
let invoices=[];async function init(){const u=await requireAuthAsync();if(!u)return;renderUserChip('userChip');setActiveNav();await loadInvoices()}async function loadInvoices(){try{const r=await getCloudInvoices();if(r.error)throw new Error(r.error.message);invoices=r.data||[];renderInvoices()}catch(e){console.error(e);showToast(e.message||'Unable to load invoices','error')}}function openInvoice(id){location.href='app.html?invoice='+encodeURIComponent(id)}async function deleteInvoice(id){if(!confirm('Delete this invoice?'))return;try{const r=await deleteCloudInvoice(id);if(r.error)throw new Error(r.error.message);showToast('Invoice deleted','info');await loadInvoices()}catch(e){showToast(e.message||'Unable to delete invoice','error')}}async function duplicateInvoice(id){const inv=invoices.find(i=>String(i.id)===String(id));if(!inv)return;const copy={...inv};delete copy.id;copy.invoice_number=(inv.invoice_number||inv.inv_number||'INV')+'-COPY';const r=await createCloudInvoice(copy);if(r.error){showToast(r.error.message,'error');return}showToast('Invoice duplicated ✅','success');await loadInvoices()}async function markPaid(id){const r=await updateCloudInvoice(id,{status:'paid'});if(r.error){showToast(r.error.message,'error');return}showToast('Marked as paid 💚','success');await loadInvoices()}function renderInvoices(){const q=(document.getElementById('search').value||'').toLowerCase();const filtered=invoices.filter(i=>(i.company||'').toLowerCase().includes(q)||(i.customer||'').toLowerCase().includes(q)||(i.invoice_number||i.invNumber||'').toLowerCase().includes(q));document.getElementById('invoiceCountLabel').textContent=`${invoices.length} invoice${invoices.length!==1?'s':''}`;const tbody=document.getElementById('invoiceTable'),empty=document.getElementById('emptyState');if(!filtered.length){tbody.innerHTML='';empty.style.display='block';return}empty.style.display='none';const sym={PKR:'₨',USD:'$',EUR:'€',AED:'AED ',GBP:'£'};tbody.innerHTML=filtered.map(i=>{const num=i.invoice_number||i.invNumber||i.id;const s=sym[i.currency]||((i.currency||'')+' ');const amount=i.total!=null?`${s}${Number(i.total).toLocaleString('en',{minimumFractionDigits:2})}`:'—';const status=i.status||'saved';const date=i.invoice_date||i.date||i.created_at;return `<tr><td><span class="mono" style="font-size:13px;font-weight:600">${escapeHtml(num)}</span></td><td><strong>${escapeHtml(i.company)||'—'}</strong></td><td>${escapeHtml(i.customer)||'—'}</td><td style="color:var(--muted);font-size:13px">${date?new Date(date).toLocaleDateString('en-GB'):'—'}</td><td><span class="inv-amount">${amount}</span></td><td><span class="status-badge status-${status}">${status==='paid'?'✅ Paid':'📄 Saved'}</span></td><td><div class="action-btns"><button class="btn btn-outline btn-sm" onclick="openInvoice('${String(i.id).replaceAll("'","\\'")}')">📂 Open</button>${status!=='paid'?`<button class="btn btn-sm" style="background:var(--mint-l);color:var(--mint)" onclick="markPaid('${String(i.id).replaceAll("'","\\'")}')">Paid</button>`:''}<button class="btn btn-ghost btn-sm" onclick="duplicateInvoice('${String(i.id).replaceAll("'","\\'")}')">📋</button><button class="btn btn-danger btn-sm" onclick="deleteInvoice('${String(i.id).replaceAll("'","\\'")}')">🗑️</button></div></td></tr>`}).join('')}function toggleSidebar(){document.querySelector('.sidebar').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('open')}init();
</script></body></html>
