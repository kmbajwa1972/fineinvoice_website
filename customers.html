<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="logo.jpg">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customers — FineInvoice</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
.add-customer-card { margin-bottom: 24px; }
.add-customer-card .card-head { padding:16px 24px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px; }
.form-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 24px; }
.form-grid .full { grid-column:1/-1; }
.action-btns { display:flex;gap:6px; }
.avatar-cell { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;flex-shrink:0; }
.customer-row td { vertical-align:middle; }
.search-bar { display:flex;gap:12px;margin-bottom:20px; }
.search-wrap { position:relative;flex:1; }
.search-wrap .search-icon { position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none; }
.search-wrap input { padding-left:40px; }
.empty-state { text-align:center;padding:80px 20px;color:var(--muted); }
.empty-state .icon { font-size:56px;margin-bottom:16px; }
.edit-mode .card-head { background:var(--violet-l);color:var(--violet); }
</style>
</head>
<body>
<div class="app-layout">
<button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button><div class="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar"><div class="sb-logo"><img src="logo.jpg" alt="FineInvoice"><span>FineInvoice</span></div>
<nav class="sb-nav"><a href="dashboard.html"><span class="ni">🏠</span>Dashboard</a><a href="app.html"><span class="ni">✏️</span>New Invoice</a><a href="invoices.html"><span class="ni">📋</span>Invoices</a><a href="templates.html"><span class="ni">📄</span>Templates</a><a href="receipt.html"><span class="ni">🧾</span>Receipts</a><a href="reports.html"><span class="ni">📊</span>Reports</a><a href="customers.html" class="active"><span class="ni">👥</span>Customers</a><a href="payment.html"><span class="ni">💳</span>Billing</a></nav>
<div class="sb-footer"><a href="#" onclick="logout();return false"><span>🚪</span>Sign Out</a></div></aside>
<div class="main-content"><div class="topbar"><span class="topbar-title">👥 Customers</span><div class="topbar-right" id="userChip"></div></div>
<div class="page-body">
<div class="card add-customer-card" id="formCard"><div class="card-head" id="formTitle">➕ Add Customer</div><div class="form-grid">
<div><label class="form-label">Full Name *</label><input class="form-input" id="cName" placeholder="e.g. Ali Hassan"></div>
<div><label class="form-label">Company</label><input class="form-input" id="cCompany" placeholder="Company name"></div>
<div><label class="form-label">Email</label><input class="form-input" id="cEmail" type="email" placeholder="email@example.com"></div>
<div><label class="form-label">Phone</label><input class="form-input" id="cPhone" placeholder="+92 300 0000000"></div>
<div class="full"><label class="form-label">Address</label><input class="form-input" id="cAddress" placeholder="Street, City, Country"></div>
<div class="full" style="display:flex;gap:10px"><button class="btn btn-primary" id="saveBtn" onclick="saveCustomer()">💾 Save Customer</button><button class="btn btn-ghost" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button></div>
</div></div>
<div class="section-head mb-4"><div><div class="section-title" style="font-size:18px">Customer List</div><div class="text-muted text-sm mt-1" id="custCountLabel">0 customers</div></div></div>
<div class="search-bar"><div class="search-wrap"><span class="search-icon">🔍</span><input class="form-input" id="search" placeholder="Search customers…" oninput="renderCustomers()"></div></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th></th><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead><tbody id="customerTable"></tbody></table></div><div id="emptyState" class="empty-state" style="display:none"><div class="icon">👤</div><h3>No customers yet</h3><p>Add your first customer using the form above.</p></div></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/utils.js"></script>
<script>
let editId=null;const colors=['#6C3FF5','#FF5C5C','#00C48C','#3AB3FF','#FFB547','#EC4899'];
function getColor(str){let h=0;for(const c of(str||''))h=(h<<5)-h+c.charCodeAt(0);return colors[Math.abs(h)%colors.length]}
function esc(v){return typeof escapeHtml==='function'?escapeHtml(v??''):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function init(){if(!(await requireAuth()))return;renderUserChip('userChip');setActiveNav();await renderCustomers()}
async function saveCustomer(){const name=document.getElementById('cName').value.trim();if(!name){showToast('Name is required','error');return}const data={name,company:document.getElementById('cCompany').value.trim(),email:document.getElementById('cEmail').value.trim(),phone:document.getElementById('cPhone').value.trim(),address:document.getElementById('cAddress').value.trim()};try{if(editId)await updateCustomer(editId,data);else await createCustomer(data);showToast(editId?'Customer updated ✅':'Customer added ✅','success');cancelEdit();await renderCustomers()}catch(e){console.error(e);showToast(e.message||'Unable to save customer','error')}}
async function editCustomer(id){try{const c=(await getCustomers({fresh:true})).find(x=>String(x.id)===String(id));if(!c)return;editId=c.id;for(const [id,val] of [['cName',c.name],['cCompany',c.company],['cEmail',c.email],['cPhone',c.phone],['cAddress',c.address]])document.getElementById(id).value=val||'';document.getElementById('formTitle').textContent='✏️ Edit Customer';document.getElementById('formCard').classList.add('edit-mode');document.getElementById('cancelBtn').style.display='inline-flex';document.getElementById('saveBtn').textContent='💾 Update Customer';document.getElementById('cName').focus();window.scrollTo({top:0,behavior:'smooth'})}catch(e){showToast(e.message||'Unable to load customer','error')}}
function cancelEdit(){editId=null;['cName','cCompany','cEmail','cPhone','cAddress'].forEach(id=>document.getElementById(id).value='');document.getElementById('formTitle').textContent='➕ Add Customer';document.getElementById('formCard').classList.remove('edit-mode');document.getElementById('cancelBtn').style.display='none';document.getElementById('saveBtn').textContent='💾 Save Customer'}
async function deleteCustomer(id){if(!confirm('Delete this customer?'))return;try{await removeCustomer(id);showToast('Customer deleted','info');await renderCustomers()}catch(e){showToast(e.message||'Unable to delete customer','error')}}
async function renderCustomers(){try{const q=(document.getElementById('search')?.value||'').toLowerCase();const all=await getCustomers({fresh:true});const filtered=all.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.company||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q));document.getElementById('custCountLabel').textContent=`${all.length} customer${all.length!==1?'s':''}`;const tbody=document.getElementById('customerTable'),empty=document.getElementById('emptyState');if(!filtered.length){tbody.innerHTML='';empty.style.display='block';return}empty.style.display='none';tbody.innerHTML=filtered.map(c=>{const name=esc(c.name),initials=String(c.name||'').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);return `<tr class="customer-row"><td><div class="avatar-cell" style="background:${getColor(c.name)}">${esc(initials)}</div></td><td><strong>${name}</strong></td><td>${esc(c.company)||'—'}</td><td style="color:var(--muted);font-size:13px">${esc(c.email)||'—'}</td><td style="color:var(--muted);font-size:13px">${esc(c.phone)||'—'}</td><td><div class="action-btns"><button class="btn btn-outline btn-sm" onclick="editCustomer('${String(c.id).replace(/'/g,"\\'")}')">✏️ Edit</button><button class="btn btn-danger btn-sm" onclick="deleteCustomer('${String(c.id).replace(/'/g,"\\'")}')">🗑️</button></div></td></tr>`}).join('')}catch(e){console.error(e);showToast(e.message||'Unable to load customers','error')}}
function toggleSidebar(){document.querySelector('.sidebar').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('open')}
init();
</script></body></html>
