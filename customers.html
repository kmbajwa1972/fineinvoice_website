<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><link rel="icon" href="logo.jpg"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers — FineInvoice</title><link rel="stylesheet" href="css/theme.css"><style>.add-customer-card{margin-bottom:24px}.add-customer-card .card-head{padding:16px 24px;border-bottom:1px solid var(--border);font-weight:700}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 24px}.form-grid .full{grid-column:1/-1}.action-btns{display:flex;gap:6px}.avatar-cell{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}.search-bar{display:flex;margin-bottom:20px}.search-wrap{position:relative;flex:1}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%)}.search-wrap input{padding-left:40px}.empty-state{text-align:center;padding:80px 20px;color:var(--muted)}.empty-state .icon{font-size:56px}.edit-mode .card-head{background:var(--violet-l);color:var(--violet)}@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}</style></head><body><div class="app-layout"><button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button><div class="sidebar-overlay" onclick="toggleSidebar()"></div><aside class="sidebar"><div class="sb-logo"><img src="logo.jpg" alt="FineInvoice"><span>FineInvoice</span></div><nav class="sb-nav"><a href="dashboard.html">🏠 Dashboard</a><a href="app.html">✏️ New Invoice</a><a href="invoices.html">📋 Invoices</a><a href="templates.html">📄 Templates</a><a href="receipt.html">🧾 Receipts</a><a href="reports.html">📊 Reports</a><a href="customers.html" class="active">👥 Customers</a><a href="payment.html">💳 Billing</a></nav><div class="sb-footer"><a href="#" onclick="logout();return false">🚪 Sign Out</a></div></aside><div class="main-content"><div class="topbar"><span class="topbar-title">👥 Customers</span><div class="topbar-right" id="userChip"></div></div><div class="page-body"><div class="card add-customer-card" id="formCard"><div class="card-head" id="formTitle">➕ Add Customer</div><div class="form-grid"><div><label class="form-label">Full Name *</label><input class="form-input" id="cName" placeholder="e.g. Ali Hassan"></div><div><label class="form-label">Company</label><input class="form-input" id="cCompany" placeholder="Company name"></div><div><label class="form-label">Email</label><input class="form-input" id="cEmail" type="email" placeholder="email@example.com"></div><div><label class="form-label">Phone</label><input class="form-input" id="cPhone" placeholder="+92 300 0000000"></div><div class="full"><label class="form-label">Address</label><input class="form-input" id="cAddress" placeholder="Street, City, Country"></div><div class="full"><button class="btn btn-primary" id="saveBtn" onclick="saveCustomer()">💾 Save Customer</button> <button class="btn btn-ghost" id="cancelBtn" onclick="cancelEdit()" style="display:none">Cancel</button></div></div></div><div class="section-head mb-4"><div><div class="section-title" style="font-size:18px">Customer List</div><div class="text-muted text-sm mt-1" id="custCountLabel">0 customers</div></div></div><div class="search-bar"><div class="search-wrap"><span class="search-icon">🔍</span><input class="form-input" id="search" placeholder="Search customers…" oninput="renderCustomers()"></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th></th><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead><tbody id="customerTable"></tbody></table></div><div id="emptyState" class="empty-state" style="display:none"><div class="icon">👤</div><h3>No customers yet</h3><p>Add your first customer using the form above.</p></div></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/utils.js"></script><script>let editId=null;const colors=['#6C3FF5','#FF5C5C','#00C48C','#3AB3FF','#FFB547','#EC4899'];function getColor(s){let h=0;for(const c of(s||''))h=(h<<5)-h+c.charCodeAt(0);return colors[Math.abs(h)%colors.length]}function esc(v){return typeof escapeHtml==='function'?escapeHtml(v??''):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){const u=await requireAuthAsync();if(!u)return;renderUserChip('userChip');setActiveNav();await renderCustomers()}async function saveCustomer(){const name=cName.value.trim();if(!name){showToast('Name is required','error');return}const data={name,company:cCompany.value.trim(),email:cEmail.value.trim(),phone:cPhone.value.trim(),address:cAddress.value.trim()};try{let r;if(editId)r=await updateCloudCustomer(editId,data);else r=await createCloudCustomer(data);if(r.error)throw r.error;showToast(editId?'Customer updated ✅':'Customer added ✅','success');cancelEdit();await renderCustomers()}catch(e){console.error(e);showToast(e.message||'Unable to save customer','error')}}async function editCustomer(id){try{const r=await getCloudCustomers();if(r.error)throw r.error;const c=(r.data||[]).find(x=>String(x.id)===String(id));if(!c)return;editId=c.id;cName.value=c.name||'';cCompany.value=c.company||'';cEmail.value=c.email||'';cPhone.value=c.phone||'';cAddress.value=c.address||'';formTitle.textContent='✏️ Edit Customer';formCard.classList.add('edit-mode');cancelBtn.style.display='inline-flex';saveBtn.textContent='💾 Update Customer';cName.focus();window.scrollTo({top:0,behavior:'smooth'})}catch(e){showToast(e.message||'Unable to load customer','error')}}function cancelEdit(){editId=null;['cName','cCompany','cEmail','cPhone','cAddress'].forEach(id=>document.getElementById(id).value='');formTitle.textContent='➕ Add Customer';formCard.classList.remove('edit-mode');cancelBtn.style.display='none';saveBtn.textContent='💾 Save Customer'}async function deleteCustomer(id){if(!confirm('Delete this customer?'))return;try{const r=await deleteCloudCustomer(id);if(r.error)throw r.error;showToast('Customer deleted','info');await renderCustomers()}catch(e){showToast(e.message||'Unable to delete customer','error')}}async function renderCustomers(){try{const r=await getCloudCustomers();if(r.error)throw r.error;const all=r.data||[],q=(search.value||'').toLowerCase(),filtered=all.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.company||'').toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q));custCountLabel.textContent=`${all.length} customer${all.length!==1?'s':''}`;if(!filtered.length){customerTable.innerHTML='';emptyState.style.display='block';return}emptyState.style.display='none';customerTable.innerHTML=filtered.map(c=>{const initials=String(c.name||'').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2),id=String(c.id).replace(/'/g,'\\\'');return `<tr><td><div class="avatar-cell" style="background:${getColor(c.name)}">${esc(initials)}</div></td><td><strong>${esc(c.name)}</strong></td><td>${esc(c.company)||'—'}</td><td>${esc(c.email)||'—'}</td><td>${esc(c.phone)||'—'}</td><td><div class="action-btns"><button class="btn btn-outline btn-sm" onclick="editCustomer('${id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteCustomer('${id}')">🗑️</button></div></td></tr>`}).join('')}catch(e){console.error(e);showToast(e.message||'Unable to load customers','error')}}function toggleSidebar(){document.querySelector('.sidebar').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('open')}init();</script></body></html>
