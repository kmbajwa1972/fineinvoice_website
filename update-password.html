<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Set New Password — FineInvoice</title><link rel="icon" href="logo.jpg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060412;color:#fff;font-family:Arial,sans-serif}.card{width:min(430px,calc(100% - 32px));background:#0d0a1f;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:34px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:27px}p{color:#999;line-height:1.5}.input{width:100%;padding:13px 15px;margin:8px 0 12px;border-radius:10px;border:1px solid #333;background:#151126;color:#fff;font-size:15px}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.msg{margin-top:15px;text-align:center;font-size:14px;line-height:1.4}.link{display:block;text-align:center;margin-top:18px;color:#a78bfa;text-decoration:none}</style></head><body><main class="card"><h1>Choose a new password</h1><p>Set a new password for your FineInvoice account.</p><input class="input" id="password" type="password" autocomplete="new-password" placeholder="New password"><input class="input" id="confirm" type="password" autocomplete="new-password" placeholder="Confirm new password"><button class="btn" id="btn" type="button">Update Password</button><div class="msg" id="msg" role="status" aria-live="polite"></div><a class="link" href="signin.html">← Back to Sign In</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>(function(){const SUPABASE_URL='https://mozllscpvaxdigatsxiu.supabase.co';const SUPABASE_KEY='sb_publishable_r_O7AsGp8D91rDquxrCJrw_7OMCI6kG';const sb=window.supabase&&window.supabase.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;const p=document.getElementById('password'),c=document.getElementById('confirm'),btn=document.getElementById('btn'),msg=document.getElementById('msg');function show(t,ok){msg.textContent=t;msg.style.color=ok?'#00c48c':'#ff6b6b'}async function update(){if(!sb){show('Authentication service could not be loaded. Please refresh and try again.');return}if(p.value.length<8){show('Password must be at least 8 characters.');return}if(p.value!==c.value){show('Passwords do not match.');return}btn.disabled=true;btn.textContent='Updating…';try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session)throw new Error('This password-reset link is invalid or has expired. Please request a new link.');const result=await sb.auth.updateUser({password:p.value});if(result.error)throw result.error;show('Password updated successfully. Redirecting to Sign In…',true);await sb.auth.signOut();setTimeout(()=>location.href='signin.html',1200)}catch(e){show(e.message||'Unable to update your password.');btn.disabled=false;btn.textContent='Update Password'}}btn.addEventListener('click',update)})();</script></body></html>
