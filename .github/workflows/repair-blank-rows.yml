name: Repair blank invoice rows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix recursive getInvoiceRows
        run: |
          python - <<'PY2'
          from pathlib import Path
          path = Path("app.html")
          text = path.read_text(encoding="utf-8")
          old = "function getInvoiceRows(){return getInvoiceRows().filter(tr=>"
          new = "function getInvoiceRows(){return [...document.querySelectorAll('#itemsBody tr')].filter(tr=>"
          if old not in text:
              raise SystemExit("Expected recursive getInvoiceRows bug was not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          print("Fixed getInvoiceRows recursion")
          PY2
      - name: Commit repair and remove workflow
        run: |
          git config user.name "FineInvoice Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          git rm -f .github/workflows/repair-blank-rows.yml
          git commit -m "Fix blank invoice row filtering"
          git push
