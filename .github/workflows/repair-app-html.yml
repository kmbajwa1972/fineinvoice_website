name: Repair app.html

on:
  push:
    paths:
      - '.github/workflows/repair-app-html.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good app.html and apply requested fixes
        shell: bash
        run: |
          set -euo pipefail
          git show 23dc3769649644ead14b47efb43b153bfebef5ea:app.html > app.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          old = '.items-table .desc-col{width:32%}.items-table .qty-col{width:8%}.items-table .unit-col{width:10%}.items-table .rate-col{width:14%}.items-table .tax-col{width:9%}.items-table .disc-col{width:9%}.items-table .amt-col{width:12%;font-weight:600;color:var(--violet);padding-left:8px;white-space:nowrap}'
          new = '.items-table .desc-col{width:42%;min-width:260px}.items-table .qty-col{width:11%;min-width:90px;text-align:center}.items-table .unit-col{width:10%;min-width:90px}.items-table .rate-col{width:16%;min-width:130px}.items-table .tax-col{width:8%;min-width:80px}.items-table .disc-col{width:8%;min-width:80px}.items-table .amt-col{width:16%;min-width:135px;font-weight:600;color:var(--violet);padding-left:8px;white-space:nowrap}'
          if old not in s:
              raise SystemExit('Expected column CSS not found')
          s = s.replace(old, new, 1)
          marker = '.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;margin-left:auto}'
          css = '''\n.form-select{color:var(--text)!important;background:#17132b!important;color-scheme:dark}\n.form-select option{background:#17132b!important;color:#fff!important}\n#invoiceDoc{overflow:visible!important}\n.inv-totals{break-inside:avoid!important;page-break-inside:avoid!important}\n.inv-totals-box{display:block!important;min-width:220px}\n.inv-grand{min-height:28px}\n@media print{body.print-mode #invoiceDoc{overflow:visible!important}.inv-totals{break-inside:avoid!important;page-break-inside:avoid!important}}\n'''
          if marker not in s:
              raise SystemExit('Expected CSS marker not found')
          s = s.replace(marker, marker + css, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'background:#17132b' app.html
          grep -q 'break-inside:avoid' app.html
          grep -q 'min-width:90px' app.html

      - name: Commit repaired app.html
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Restore app builder and fix currency and PDF total' || exit 0
          git push origin HEAD:repair/professional-clean-2026-08-12

      - name: Remove repair workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-app-html.yml
          git add -A
          git commit -m 'Remove temporary app repair workflow' || exit 0
          git push origin HEAD:repair/professional-clean-2026-08-12
