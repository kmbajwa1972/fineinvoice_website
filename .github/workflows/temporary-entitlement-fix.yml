name: Temporary entitlement repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'repair:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply entitlement fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/utils.js')
          s = p.read_text()

          old = "user.freePdfCredits=Number.isFinite(Number(user.freePdfCredits))?Math.max(0,Number(user.freePdfCredits)):(Number.isFinite(Number(user.singleCredits))?Math.max(0,Number(user.singleCredits)):3);"
          new = "user.freePdfCredits=Number.isFinite(Number(user.freePdfCredits))?Math.max(0,Number(user.freePdfCredits)):(Number.isFinite(Number(user.singleCredits))?Math.max(0,Number(user.singleCredits)):(plan==='free'?3:0));"
          if old not in s:
              raise SystemExit('normalizePlanUser target not found')
          s = s.replace(old, new, 1)

          old = "const freeRaw=meta.freePdfCredits??previous.freePdfCredits??meta.singleCredits??previous.singleCredits??3;"
          new = "const freeRaw=meta.freePdfCredits??previous.freePdfCredits??meta.singleCredits??previous.singleCredits??(plan==='free'?3:0);"
          if old not in s:
              raise SystemExit('applyRemoteEntitlementUser target not found')
          s = s.replace(old, new, 1)

          old = "freePdfCredits:Number(m.freePdfCredits??m.singleCredits??user?.freePdfCredits??user?.singleCredits??3),paidSingleCredits:Number(m.paidSingleCredits??user?.paidSingleCredits??0),singleCredits:Number(m.freePdfCredits??m.singleCredits??user?.freePdfCredits??user?.singleCredits??3)"
          new = "freePdfCredits:Number(m.freePdfCredits??m.singleCredits??user?.freePdfCredits??user?.singleCredits??(plan==='free'?3:0)),paidSingleCredits:Number(m.paidSingleCredits??user?.paidSingleCredits??0),singleCredits:Number(m.freePdfCredits??m.singleCredits??user?.freePdfCredits??user?.singleCredits??(plan==='free'?3:0))"
          if old not in s:
              raise SystemExit('loadGateUser target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('supabase/functions/polar-webhook/index.ts')
          s = p.read_text()
          old = "      plan,\n      plan_activated_at: activatedAt,"
          new = "      plan,\n      plan_activated_at: activatedAt,\n      freePdfCredits: plan === 'free' ? 3 : 0,\n      paidSingleCredits: plan === 'single' ? 1 : 0,\n      singleCredits: plan === 'free' ? 3 : 0,\n      unlockedInvoiceIds: [],"
          if old not in s:
              raise SystemExit('webhook metadata target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/utils.js supabase/functions/polar-webhook/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "repair: fix single entitlement credit fallback"
          git push
