name: Fix Single invoice access identity

on:
  push:
    branches:
      - repair/professional-clean-2026-08-12

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.html invoice access identity
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app.html")
          s = p.read_text(encoding="utf-8")

          old = "String(currentDraftId)"
          new = "String((typeof currentDraftId !== 'undefined' && currentDraftId) ? currentDraftId : (document.getElementById('invNumber')?.value || 'draft'))"

          count = s.count(old)
          if count == 0:
              print("No currentDraftId access expressions found; nothing to patch.")
              raise SystemExit(0)

          s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          print(f"Patched {count} invoice access expression(s).")
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Single invoice access identity"
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-single-invoice-access-20260814.yml
          git add .github/workflows/fix-single-invoice-access-20260814.yml
          if git diff --cached --quiet; then
            echo "Workflow already absent from working tree."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove temporary invoice access repair workflow"
            git push
          fi
