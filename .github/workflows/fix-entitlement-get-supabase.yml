name: Fix entitlement client resolver

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/professional-clean-2026-08-12
          fetch-depth: 0
      - name: Patch utils.js safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/utils.js')
          s=p.read_text(encoding='utf-8')
          old="""async function syncEntitlementsNow(){\n  const sb=getSupabase();\n  if(!sb)return false;"""
          new="""async function syncEntitlementsNow(){\n  let sb=null;\n  try{\n    if(typeof getSupabase==='function') sb=getSupabase();\n  }catch(err){\n    console.warn('FineInvoice getSupabase resolver unavailable:',err);\n  }\n  if(!sb && window._supabase) sb=window._supabase;\n  if(!sb && window.supabase && typeof window.supabase.createClient==='function'){\n    try{\n      window._supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});\n      sb=window._supabase;\n    }catch(err){\n      console.warn('FineInvoice Supabase client creation failed:',err);\n    }\n  }\n  if(!sb)return false;"""
          if old not in s:
              raise SystemExit('target syncEntitlementsNow block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "FineInvoice Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/utils.js
          git commit -m "Fix entitlement Supabase client resolver"
          git push origin HEAD:repair/professional-clean-2026-08-12
      - name: Remove workflow
        run: |
          git rm .github/workflows/fix-entitlement-get-supabase.yml
          git commit -m "Remove temporary entitlement resolver workflow"
          git push origin HEAD:repair/professional-clean-2026-08-12
