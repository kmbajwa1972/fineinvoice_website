name: Fix utils syntax error
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/professional-clean-2026-08-12
          fetch-depth: 0
      - name: Repair invalid token and start entitlement sync
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/utils.js')
          s=p.read_text(encoding='utf-8')
          # A stray standalone backslash before applyRemoteEntitlementUser causes
          # the browser's "Invalid or unexpected token" SyntaxError.
          s=s.replace("saveCurrentUser(u)}\\nfunction applyRemoteEntitlementUser", "saveCurrentUser(u)}\nfunction applyRemoteEntitlementUser")
          # Ensure the automatic entitlement polling is actually started.
          if "window.addEventListener('DOMContentLoaded',startEntitlementSync);" not in s:
              s += "\n\nwindow.addEventListener('DOMContentLoaded',startEntitlementSync);\n"
          p.write_text(s,encoding='utf-8')
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('js/utils.js').read_text(encoding='utf-8')
          assert "saveCurrentUser(u)}\\nfunction applyRemoteEntitlementUser" not in s
          assert "function applyRemoteEntitlementUser" in s
          assert "window.addEventListener('DOMContentLoaded',startEntitlementSync);" in s
          PY
      - name: Commit and push
        run: |
          git config user.name "FineInvoice Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/utils.js
          git commit -m "Fix utils syntax error and start entitlement sync"
          git push origin HEAD:repair/professional-clean-2026-08-12
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-utils-syntax.yml
          git commit -m "Remove temporary utils repair workflow"
          git push origin HEAD:repair/professional-clean-2026-08-12
