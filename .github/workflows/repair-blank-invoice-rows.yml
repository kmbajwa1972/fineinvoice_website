name: Repair blank invoice rows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-blank-invoice-rows.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove blank invoice rows from rendered and saved data
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.html')
          text = path.read_text(encoding='utf-8')

          old_live = "const isAdv=advancedMode,rows=[...document.querySelectorAll('#itemsBody tr')].map(tr=>{"
          new_live = "const isAdv=advancedMode,rows=[...document.querySelectorAll('#itemsBody tr')].filter(tr=>{const ins=tr.querySelectorAll('input');const desc=(ins[0]?.value||'').trim(),rate=parseFloat(ins[3]?.value)||0;return desc!==''||rate!==0;}).map(tr=>{"
          if old_live not in text:
              raise SystemExit('Could not find livePreview row renderer pattern')
          text = text.replace(old_live, new_live, 1)

          old_save = "items:[...document.querySelectorAll('#itemsBody tr')].map(tr=>{const ins=tr.querySelectorAll('input');return{desc:ins[0].value,qty:ins[1].value,unit:ins[2].value,rate:ins[3].value,itemTax:ins[4].value,itemDisc:ins[5].value}})"
          new_save = "items:[...document.querySelectorAll('#itemsBody tr')].filter(tr=>{const ins=tr.querySelectorAll('input');const desc=(ins[0]?.value||'').trim(),rate=parseFloat(ins[3]?.value)||0;return desc!==''||rate!==0;}).map(tr=>{const ins=tr.querySelectorAll('input');return{desc:ins[0].value,qty:ins[1].value,unit:ins[2].value,rate:ins[3].value,itemTax:ins[4].value,itemDisc:ins[5].value}})"
          if old_save not in text:
              raise SystemExit('Could not find saveInvoice item mapping pattern')
          text = text.replace(old_save, new_save, 1)

          path.write_text(text, encoding='utf-8')
          print('Patched app.html')

      - name: Commit repair
        run: |
          git config user.name 'FineInvoice Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix blank invoice rows in preview and saved invoices'
          git push

      - name: Remove temporary repair workflow
        if: always()
        run: |
          git config user.name 'FineInvoice Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/repair-blank-invoice-rows.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'Remove temporary repair workflow'
          git push
