name: Expand Invoice Preview and PDF Layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand invoice preview and print/PDF height
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('css/theme.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* FineInvoice invoice preview height expansion */'
          if marker not in text:
              text += r'''

          /* FineInvoice invoice preview height expansion */
          /* This changes the canvas/page height, not the font size. */
          .preview-sticky { align-self: start; }
          .preview-wrap { min-height: 1100px !important; }
          .preview-body { min-height: 1040px !important; padding: 24px !important; }
          #invoiceDoc { min-height: 1040px !important; }
          .invoice-paper { min-height: 1040px !important; }

          @media print {
            body.print-mode .preview-body { min-height: 0 !important; padding: 0 !important; }
            body.print-mode #invoiceDoc { min-height: 1040px !important; }
            body.print-mode .invoice-paper { min-height: 1040px !important; }
          }
          '''
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "FineInvoice Repair Bot"
          git config user.email "actions@github.com"
          git add css/theme.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Expand invoice preview and PDF page height"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "FineInvoice Repair Bot"
          git config user.email "actions@github.com"
          rm -f .github/workflows/expand-invoice-preview.yml
          git add .github/workflows/expand-invoice-preview.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary invoice preview repair workflow"
          git push
