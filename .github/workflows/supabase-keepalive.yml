name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 8:00 AM UTC
  workflow_dispatch:        # Manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mozllscpvaxdigatsxiu.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vemxsc2NwdmF4ZGlnYXRzeGl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDAwOTUsImV4cCI6MjA5Nzk3NjA5NX0.-DS2gRmOQVUilEPljbUbffNikr9BK8IEg3iGD319RDk" \
            --max-time 15)
          echo "Supabase response: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ]; then
            echo "✅ Supabase is alive"
          else
            echo "⚠️ Supabase may be paused (status: $STATUS)"
            exit 1
          fi
