name: Supabase Keepalive

on:
  schedule:
    # Run every 3 days to keep the FineInvoice Supabase project active.
    - cron: '17 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          set -e
          echo "Pinging FineInvoice Supabase..."
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "Supabase HTTP status: $status"
          if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
            echo "Supabase responded successfully."
          else
            echo "Supabase ping failed with HTTP $status"
            exit 1
          fi
        env:
          SUPABASE_URL: https://mozllscpvaxdigatsxiu.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
