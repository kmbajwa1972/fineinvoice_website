name: Fix utils syntax 2
on:
  push:
    branches:
      - repair/professional-clean-2026-08-12
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/professional-clean-2026-08-12
          fetch-depth: 0
      - name: Remove stray backslash
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('js/utils.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\\\s*\nfunction applyRemoteEntitlementUser', '\nfunction applyRemoteEntitlementUser', s, count=1)
          p.write_text(s, encoding='utf-8')
      - name: Verify syntax
        run: |
          node --check js/utils.js
          ! grep -n -F '\\' js/utils.js | grep -A1 -B1 'applyRemoteEntitlementUser' || true
      - name: Commit repair
        run: |
          git config user.name 'FineInvoice Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/utils.js
          git commit -m 'Fix utils.js invalid token'
          git push origin HEAD:repair/professional-clean-2026-08-12
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-utils-syntax2.yml
          git commit -m 'Remove temporary syntax repair workflow'
          git push origin HEAD:repair/professional-clean-2026-08-12
