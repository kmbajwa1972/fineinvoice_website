name: Repair cloud persistence injection
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject cloud data layer
        shell: bash
        run: |
          set -e
          changed=0
          for f in app.html invoices.html; do
            if [ -f "$f" ] && ! grep -q 'js/cloud-data.js' "$f"; then
              python3 - "$f" <<'PY'
import sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
needle='</body>'
if needle not in s:
    raise SystemExit(f'{p}: missing </body>')
s=s.replace(needle,'<script src="js/cloud-data.js"></script>\n</body>',1)
open(p,'w',encoding='utf-8').write(s)
PY
              changed=1
            fi
          done
          if [ "$changed" = 1 ]; then
            git config user.name 'fineinvoice-repair-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add app.html invoices.html
            git commit -m 'Fix persistent invoice cloud storage wiring'
            git push
          else
            echo 'Cloud data layer already injected.'
          fi
