name: Enable FineInvoice live entitlement sync

on:
  workflow_dispatch:
  push:
    branches:
      - repair/professional-clean-2026-08-12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/professional-clean-2026-08-12
          fetch-depth: 0

      - name: Enable entitlement polling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/utils.js')
          text = p.read_text(encoding='utf-8')
          marker = "window.addEventListener('DOMContentLoaded',startEntitlementSync);"
          if marker not in text:
              text += "\n\n// Start live Polar/Supabase entitlement synchronization.\nwindow.addEventListener('DOMContentLoaded',startEntitlementSync);\n"
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -q "window.addEventListener('DOMContentLoaded',startEntitlementSync);" js/utils.js
          grep -q "function startEntitlementSync" js/utils.js

      - name: Commit
        run: |
          git config user.name "FineInvoice Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/utils.js
          git diff --cached --quiet || git commit -m "Enable automatic live entitlement updates"
          git push origin HEAD:repair/professional-clean-2026-08-12

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/enable-live-entitlement-sync-20260814.yml
          git commit -m "Remove temporary entitlement sync workflow"
          git push origin HEAD:repair/professional-clean-2026-08-12
