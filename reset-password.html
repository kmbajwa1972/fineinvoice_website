<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset Password — FineInvoice</title>
<link rel="icon" href="logo.jpg">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060412;color:#fff;font-family:Arial,sans-serif}.card{width:min(430px,calc(100% - 32px));background:#0d0a1f;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:34px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:27px}p{color:#999;line-height:1.5}.input{width:100%;padding:13px 15px;margin:8px 0 16px;border-radius:10px;border:1px solid #333;background:#151126;color:#fff;font-size:15px}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.65;cursor:wait}.msg{margin-top:15px;text-align:center;font-size:14px;line-height:1.4}.link{display:block;text-align:center;margin-top:18px;color:#a78bfa;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<h1>Reset your password</h1>
<p>Enter your FineInvoice email address and we'll send you a secure password-reset link.</p>
<input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com">
<button class="btn" id="btn" type="button">Send Reset Link</button>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<a class="link" href="signin.html">← Back to Sign In</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  const SUPABASE_URL='https://mozllscpvaxdigatsxiu.supabase.co';
  const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
  const email=document.getElementById('email'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
  function show(text,ok){msg.textContent=text;msg.style.color=ok?'#00c48c':'#ff6b6b'}
  function client(){
    if(!window.supabase||typeof window.supabase.createClient!=='function') throw new Error('Authentication service could not be loaded. Please refresh and try again.');
    if(SUPABASE_ANON_KEY==='YOUR_SUPABASE_ANON_KEY') throw new Error('Authentication configuration is incomplete.');
    return window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  }
  async function send(){
    const value=email.value.trim();
    if(!value){show('Please enter your email address.');email.focus();return}
    if(!email.checkValidity()){show('Please enter a valid email address.');return}
    btn.disabled=true;btn.textContent='Sending…';msg.textContent='';
    try{
      const sb=client();
      const {error}=await sb.auth.resetPasswordForEmail(value,{redirectTo:window.location.origin+'/update-password.html'});
      if(error)throw error;
      show('If an account exists for this email, a password-reset link has been sent.',true);
      email.value='';
    }catch(error){show(error&&error.message?error.message:'Unable to send the reset email. Please try again.')}
    finally{btn.disabled=false;btn.textContent='Send Reset Link'}
  }
  btn.addEventListener('click',send);email.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
})();
</script>
</body>
</html>
