<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset Password — FineInvoice"><link rel="icon" href="logo.jpg"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060412;color:#fff;font-family:Arial,sans-serif}.card{width:min(420px,calc(100% - 32px));background:#0d0a1f;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:34px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:26px}p{color:#999;line-height:1.5}.input{width:100%;padding:13px 15px;margin:8px 0 16px;border-radius:10px;border:1px solid #333;background:#151126;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:700;cursor:pointer}.link{display:block;text-align:center;margin-top:18px;color:#a78bfa;text-decoration:none}.msg{margin-top:14px;text-align:center;font-size:14px}</style></head><body><main class="card"><h1>Reset your password</h1><p>Enter your email and we'll send you a secure password-reset link.</p><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com"><button class="btn" id="btn" onclick="sendReset()">Send Reset Link</button><div class="msg" id="msg"></div><a class="link" href="signin.html">← Back to Sign In</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="js/utils.js"></script><script>async function sendReset(){const email=document.getElementById('email').value.trim(),msg=document.getElementById('msg'),btn=document.getElementById('btn');if(!email){msg.textContent='Please enter your email.';return}btn.disabled=true;btn.textContent='Sending…';try{const sb=getSupabase();if(!sb)throw new Error('Authentication service is unavailable.');const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/update-password.html'});if(error)throw error;msg.style.color='#00c48c';msg.textContent='If an account exists for this email, a reset link has been sent.'}catch(e){msg.style.color='#ff6b6b';msg.textContent=e.message||'Unable to send reset link.';btn.disabled=false;btn.textContent='Send Reset Link'}}</script></body></html>
